<!DOCTYPE html><html><head><link rel="icon" href="web/icon.png"><title>Minecraft Server Control</title><style>body{font-family:'Courier New',monospace;background:#1e1e1e;color:#ccc;max-width:800px;margin:0 auto;padding:20px}.panel{background:#2d2d2d;border:1px solid #444;padding:15px;margin-bottom:20px;border-radius:4px}h1{color:#4CAF50;text-align:center;border-bottom:1px solid #444;padding-bottom:10px}.status-online{color:#4CAF50}.status-offline{color:#f44336}button{background:#3a3a3a;color:#fff;border:1px solid #555;padding:8px 15px;cursor:pointer;border-radius:3px;transition:.2s}button:hover{background:#4a4a4a;border-color:#666}button:disabled{opacity:.5;cursor:not-allowed}#console-container{background:#0f0f0f;border:1px solid #333;margin-top:5px}#console{color:#ddd;height:400px;overflow-y:auto;padding:10px;font-family:monospace;white-space:pre-wrap;font-size:16px}#command-line{display:flex;border-top:1px solid #333;padding:5px}#commandInput{flex-grow:1;padding:8px;background:#0a0a0a;border:0;color:#ddd;font-family:monospace;outline:0;font-size:16px}</style></head><body><h1>MINECRAFT SERVER CONTROL</h1><div class="panel">Status: <span id="status" class="status-offline">OFFLINE</span><div class="controls"><button id="startBtn" onclick="startServer()">Start Server</button><button id="stopBtn" onclick="stopServer()" disabled>Stop Server</button><span id="worldOptions" style="display:none"><input type="checkbox" id="newWorld"> Create new world<button id="backupBtn" onclick="backupWorld()">Backup World</button></span></div></div><div class="panel"><h3>Console Output</h3><div id="console-container"><div id="console"></div><div id="command-line"><input type="text" id="commandInput" placeholder="Enter server command..." disabled onkeypress="if(event.key=='Enter')sendCommand()"></div></div></div><script>var curState,conn;function logToConsole(e){document.getElementById("console").innerHTML+=e,document.getElementById("console").scrollTop=document.getElementById("console").scrollHeight}function clearConsole(){document.getElementById("console").innerHTML=""}async function isRunning(){try{const e=await fetch("/status");if(!e.ok)throw new Error("Network response was not ok");return"true"===(await e.text())}catch(e){return console.error("Error:",e),!1}}async function updateStatus(e=!1){const t=document.getElementById("status"),o=document.getElementById("startBtn"),s=document.getElementById("stopBtn"),a=document.getElementById("commandInput"),c=document.getElementById("worldOptions");try{const n=await isRunning();if(e&&(curState=!n),n!==curState){if(n){t.textContent="ONLINE",t.className="status-online",o.disabled=!0,s.disabled=!1,a.disabled=!1,c.style.display="none",connectWebSocket()}else{t.textContent="OFFLINE",t.className="status-offline",o.disabled=!1,s.disabled=!0,a.disabled=!0,c.style.display="inline",conn&&(conn.close(),conn=null)}curState=n}}catch(e){console.error("Status update error:",e)}}function connectWebSocket(){window.WebSocket?(conn=new WebSocket("ws://"+document.location.host+"/console",conn.onopen=function(){logToConsole("Connected to server console\n")},conn.onclose=function(e){logToConsole("<b>Connection closed.</b>")},conn.onerror=function(e){logToConsole("<b>WebSocket error: "+e.data+"</b>")},conn.onmessage=function(e){logToConsole(e.data)}):logToConsole("<b>WebSocket is not supported in this browser.</b>")}async function startServer(){if(clearConsole(),await isRunning())return void logToConsole("Server is already running.");const e=document.getElementById("newWorld").checked,t=e?"/start?newworld=true":"/start";if(e&&!confirm("Do you want to create a new world?\nThis will delete any existing world."))return void logToConsole("World creation cancelled.");document.getElementById("newWorld").checked=!1;try{document.body.style.cursor="wait";const e=await fetch(t);if(!e.ok)throw new Error("Start request failed");if("started"===(await e.text())){await new Promise(e=>setTimeout(e,1e3));const e=setInterval(async()=>{(await isRunning())&&(clearInterval(e),updateStatus())},1e3)}}catch(e){logToConsole("Error: "+e.message)}finally{document.body.style.cursor="default"}}async function stopServer(){if(!(await isRunning()))return void logToConsole("Server is not running.");try{document.body.style.cursor="wait";const e=await fetch("/stop");if(!e.ok)throw new Error("Stop request failed");if("stopped"===(await e.text())){const e=setInterval(async()=>{(await isRunning())||(clearInterval(e),updateStatus()},1e3)}}catch(e){logToConsole("Error: "+e.message)}finally{document.body.style.cursor="default"}}function backupWorld(){fetch("/backup").then(e=>{if(!e.ok)throw new Error("Backup failed");return e.text()}).then(e=>{logToConsole(e)}).catch(e=>{logToConsole("Error: "+e.message)})}function sendCommand(){const e=document.getElementById("commandInput"),t=e.value.trim();if(!t)return;conn&&1===conn.readyState?conn.send(t):logToConsole("Error: Not connected to server"),e.value=""}document.addEventListener("DOMContentLoaded",()=>{updateStatus(!0),setInterval(updateStatus,5e3)});</script></body></html>
