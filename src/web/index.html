<!DOCTYPE html>
<html>
  <head>
    <link rel="icon" type="image/x-icon" href="web/icon.png">
    <title>Minecraft Server Control</title>
    <style>
      body {
        font-family: 'Courier New', monospace;
        background: #1e1e1e;
        color: #ccc;
      }

      .container {
        max-width: 70%;
        margin: 0 auto;
        padding: 20px;
      }

      .panel {
        background: #2d2d2d;
        border: 1px solid #444;
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 4px;
      }

      h1 {
        color: #4CAF50;
        text-align: center;
        border-bottom: 1px solid #444;
        padding-bottom: 10px;
      }

      .status-online { color: #4CAF50; }
      .status-offline { color: #f44336; }

      button {
        background: #3a3a3a;
        color: white;
        border: 1px solid #555;
        padding: 8px 15px;
        cursor: pointer;
        border-radius: 3px;
        transition: 0.2s;
      }

      button:hover {
        background: #4a4a4a;
        border-color: #666;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #console-container {
        background: #0f0f0f;
        border: 1px solid #333;
        margin-top: 5px;
      }

      #console {
        color: #ddd;
        height: 400px;
        overflow-y: auto;
        padding: 10px;
        font-family: monospace;
        white-space: pre-wrap;
        font-size: 16px;
      }

      #command-line {
        display: flex;
        border-top: 1px solid #333;
        padding: 5px;
      }

      #commandInput {
        flex-grow: 1;
        padding: 8px;
        background: #0a0a0a;
        border: none;
        color: #ddd;
        font-family: monospace;
        outline: none;
        font-size: 16px;
      }
      .console-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .console-header h3 {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>MINECRAFT SERVER CONTROL</h1>

      <div class="panel">
        Status: <span id="status" class="status-offline">OFFLINE</span>
        <div class="controls">
          <button id="startBtn" onclick="startServer()">Start Server</button>
          <button id="stopBtn" onclick="stopServer()" disabled>Stop Server</button>

          <span id="worldOptions" style="display:none">
            <input type="checkbox" id="newWorld"> Create new world
            <button id="backupBtn" onclick="backupWorld()">Backup World</button>
          </span>
        </div>
      </div>

      <div class="panel">
        <div class="console-header">
          <h3>Console Output</h3>
          <button id="clearLogsBtn">Clear Logs</button>
        </div>
        <div id="console-container">
          <div id="console"></div>
          <div id="command-line">
            <input type="text" id="commandInput" placeholder="Enter server command..." disabled
                                                 onkeypress="if(event.key == 'Enter') sendCommand()">
          </div>
        </div>
      </div>
    </div>

<script>
var curState;
var conn;

function logToConsole(message) {
  const console = document.getElementById('console');
  console.innerHTML += message;
  console.scrollTop = console.scrollHeight;
}

function clearConsole() {
  const console = document.getElementById('console');
  console.innerHTML = '';
}

async function isRunning() {
  try {
    const response = await fetch('/status');
    if (!response.ok) throw new Error('Network response was not ok');
    const data = await response.text();
    return data === "true";
  } catch (error) {
    console.error('Error:', error);
    return false;
  }
}

async function updateStatus(init = false) {
  const state = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const commandInput = document.getElementById('commandInput');
  const worldOptions = document.getElementById('worldOptions');

  try {
    const running = await isRunning();

    if (init) {
      curState = !running;  // Force update on initialization
    }

    if (running !== curState) {
      if (running) {
        state.textContent = 'ONLINE';
        state.className = 'status-online';
        startBtn.disabled = true;
        stopBtn.disabled = false;
        commandInput.disabled = false;
        worldOptions.style.display = 'none';
        connectWebSocket();
      } else {
        state.textContent = 'OFFLINE';
        state.className = 'status-offline';
        startBtn.disabled = false;
        stopBtn.disabled = true;
        commandInput.disabled = true;
        worldOptions.style.display = 'inline';
        if (conn) {
          conn.close();
          conn = null;
        }
      }
      curState = running;
    }
  } catch (error) {
    console.error('Status update error:', error);
  }
}

function connectWebSocket() {
  if (window["WebSocket"]) {
    conn = new WebSocket("ws://" + document.location.host + "/console");

    conn.onopen = function() {
      logToConsole("Connected to server console\n");
    };

    conn.onclose = function (evt) {
      logToConsole("<b>Connection closed.</b>");
    };

    conn.onerror = function(evt) {
      logToConsole("<b>WebSocket error: " + evt.data + "</b>");
    };

    conn.onmessage = function (evt) {
      logToConsole(evt.data);
    };
  } else {
    logToConsole("<b>WebSocket is not supported in this browser.</b>");
  }
}

async function startServer() {
  clearConsole();

  if (await isRunning()) {
    logToConsole('Server is already running.');
    return;
  }

  const createNew = document.getElementById('newWorld').checked;
  let url = '/start'

  if (createNew) {
    const confirmation = confirm("Do you want to create a new world?\nThis will delete any existing world.");
    if (!confirmation) {
      logToConsole('World creation cancelled.');
      return;
    }
    url += '?newworld=true'
    document.getElementById('newWorld').checked = false;
  }

  try {
    document.body.style.cursor = 'wait';
    const response = await fetch(url);

    if (!response.ok) throw new Error('Start request failed');

    const data = await response.text();
    if (data === 'started') {
      await new Promise((resolve) => setTimeout(resolve, 1500));
      const checkStatus = setInterval(async () => {
        if (await isRunning()) {
          clearInterval(checkStatus);
          updateStatus();
        }
      }, 1000);
    }
  } catch (error) {
    logToConsole('Error: ' + error.message);
  } finally {
    document.body.style.cursor = 'default';
  }
}

async function stopServer() {
  if (!(await isRunning())) {
    logToConsole('Server is not running.');
    return;
  }

  try {
    document.body.style.cursor = 'wait';
    const response = await fetch('/stop');

    if (!response.ok) throw new Error('Stop request failed');

    const data = await response.text();
    if (data === 'stopped') {
      const checkStatus = setInterval(async () => {
        if (!(await isRunning())) {
          clearInterval(checkStatus);
          updateStatus();
        }
      }, 1000);
    }
  } catch (error) {
    logToConsole('Error: ' + error.message);
  } finally {
    document.body.style.cursor = 'default';
  }
}

function backupWorld() {
  fetch('/backup')
    .then(response => {
      if (!response.ok) throw new Error('Backup failed');
      return response.text();
    })
    .then(data => {
      logToConsole(data);
    })
    .catch(error => {
      logToConsole('Error: ' + error.message);
    });
}

function sendCommand() {
  const input = document.getElementById('commandInput');
  const command = input.value.trim();

  if (!command) return;

  if (conn && conn.readyState === WebSocket.OPEN) {
    conn.send(command);
  } else {
    logToConsole('Error: Not connected to server');
  }

  input.value = '';
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  updateStatus(true);
  setInterval(updateStatus, 5000);  // Regular status updates
  document.getElementById('clearLogsBtn').addEventListener('click', clearConsole);
});
</script>
</body>
</html>
